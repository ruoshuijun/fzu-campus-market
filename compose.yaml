services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fzu_market
      POSTGRES_USER: fzu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - market_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fzu -d fzu_market"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  market_pg:
